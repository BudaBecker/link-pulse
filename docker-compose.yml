# Ambiente de desenvolvimento. Comandos e limites em infra/README.md.

name: linkpulse

x-teto-banco-comparado: &teto-banco-comparado
  # Ajuste os limites dos três bancos juntos para manter a comparação.
  cpus: "2"
  mem_limit: 2g
  memswap_limit: 2g  # igual ao mem_limit: sem swap além do teto

services:
  redis-master:
    image: redis:8.2.11-bookworm
    <<: *teto-banco-comparado
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-master-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:8.2.11-bookworm
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    cpus: "1"
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-replica-dados:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q 'master_link_status:up'"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0.9
    <<: *teto-banco-comparado
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: linkpulse
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-dados:/var/lib/cassandra
    healthcheck:
      # A sondagem TCP evita consumir a cota do Cassandra com consultas periódicas.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9042"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-esquema:
    # Após aplicar o esquema, o serviço permanece ativo para o Compose concluir o --wait.
    image: cassandra:5.0.9
    entrypoint:
      - sh
      - -c
      - |
        rm -f /tmp/esquema-aplicado
        n=0
        until cqlsh cassandra -f /esquema/esquema.cql; do
          n=$$((n + 1)); [ $$n -ge 15 ] && exit 1; sleep 2
        done
        touch /tmp/esquema-aplicado && exec sleep infinity
    init: true
    cpus: "1"
    mem_limit: 256m
    volumes:
      - ./infra/cassandra:/esquema:ro
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/esquema-aplicado"]
      interval: 2s
      timeout: 2s
      retries: 45

  postgres:
    image: postgres:18.7-bookworm
    <<: *teto-banco-comparado
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
      POSTGRES_DB: linkpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pela rede: o servidor temporário da inicialização não aceita TCP.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "linkpulse", "-d", "linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0.38-noble
    cpus: "1"
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  verificar:
    build: .
    profiles: ["verificacao"]
    command: ["python", "infra/verificar_ambiente.py"]
    cpus: "1"
    mem_limit: 256m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
    depends_on:
      redis-replica:
        condition: service_healthy
      cassandra-esquema:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  redis-master-dados:
  redis-replica-dados:
  cassandra-dados:
  postgres-dados:
  mongo-dados:
