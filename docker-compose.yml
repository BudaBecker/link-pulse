# Ambiente local do Marco 2 (ADR-0013, ADR-0014, SPEC-004 passo 1).
# Subir: docker compose up -d --wait
# Detalhes, tetos e consumo medido: infra/README.md

name: linkpulse

x-teto-banco-comparado: &teto-banco-comparado
  # Mesmo teto nos três bancos comparados (Redis master, Cassandra, PostgreSQL).
  # Se o Cassandra não couber, o teto sobe nos três juntos (ADR-0013).
  cpus: "2"
  mem_limit: 2g
  memswap_limit: 2g  # igual ao mem_limit: sem swap além do teto

services:
  redis-master:
    image: redis:8.2.11-bookworm
    # Configuração padrão da imagem: sem AOF, só RDB (ADR-0013).
    <<: *teto-banco-comparado
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-master-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:8.2.11-bookworm
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    cpus: "1"
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-replica-dados:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q 'master_link_status:up'"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0.9
    # Configuração padrão da imagem (commit log periódico); só o heap é limitado.
    <<: *teto-banco-comparado
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: linkpulse
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-dados:/var/lib/cassandra
    healthcheck:
      # Sondagem leve: a porta CQL só abre ao fim da partida. Um cqlsh a cada 10 s
      # gastaria cerca de 0,35 s de CPU da cota do banco; a conferência por CQL
      # é feita uma vez, pelo cassandra-esquema.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9042"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-esquema:
    # Cria o keyspace e cliques_por_link (idempotente) e fica em espera, para que
    # `up --wait` não trate a saída do contêiner como falha.
    image: cassandra:5.0.9
    entrypoint:
      - sh
      - -c
      - |
        rm -f /tmp/esquema-aplicado
        n=0
        until cqlsh cassandra -f /esquema/esquema.cql; do
          n=$$((n + 1)); [ $$n -ge 15 ] && exit 1; sleep 2
        done
        touch /tmp/esquema-aplicado && exec sleep infinity
    init: true
    cpus: "1"
    mem_limit: 256m
    volumes:
      - ./infra/cassandra:/esquema:ro
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/esquema-aplicado"]
      interval: 2s
      timeout: 2s
      retries: 45

  postgres:
    image: postgres:18.7-bookworm
    # Todos os parâmetros no padrão (ADR-0013). O esquema é criado na primeira subida.
    <<: *teto-banco-comparado
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
      POSTGRES_DB: linkpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP, como a aplicação: na primeira subida, o servidor temporário que
      # cria o esquema só aceita conexões pelo socket local.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "linkpulse", "-d", "linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0.38-noble
    # Campanhas; fora do benchmark (ADR-0012).
    cpus: "1"
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  verificar:
    # Confere o ambiente com as bibliotecas fixadas: docker compose run --rm verificar
    build: .
    profiles: ["verificacao"]
    command: ["python", "infra/verificar_ambiente.py"]
    cpus: "1"
    mem_limit: 256m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
    depends_on:
      redis-replica:
        condition: service_healthy
      cassandra-esquema:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  redis-master-dados:
  redis-replica-dados:
  cassandra-dados:
  postgres-dados:
  mongo-dados:
