# Ambiente local do LinkPulse, um encurtador de links com analytics.
#
# Sobe, num só computador, todos os bancos do projeto: Redis (master e réplica)
# para links e contadores de cliques, Cassandra para o histórico de cliques,
# MongoDB para as campanhas e PostgreSQL, usado só como base de comparação no
# benchmark SQL x NoSQL. Os três bancos comparados (Redis master, Cassandra e
# PostgreSQL) têm o mesmo limite de CPU e memória e rodam com a configuração
# padrão das imagens oficiais, como decidido em docs/decisoes/ADR-0013.
#
# Uso, na raiz do repositório:
#   docker compose up -d --wait          sobe tudo e espera ficar saudável
#   docker compose run --rm verificar    confere bancos, esquemas e configuração
#
# Estes serviços usam os volumes de desenvolvimento. O benchmark usa os mesmos
# serviços com volumes próprios, somando docker-compose.benchmark.yml.
# Tetos, versões e consumo medido em infra/README.md.

name: linkpulse

x-teto-banco-comparado: &teto-banco-comparado
  # Bloco reaproveitado pelos três bancos comparados, para o teto ser sempre o
  # mesmo. Se o Cassandra não couber, o teto sobe nos três juntos (ADR-0013).
  cpus: "2"
  mem_limit: 2g
  memswap_limit: 2g  # igual ao mem_limit: sem swap além do teto

services:
  redis-master:
    image: redis:8.2.11-bookworm
    # Configuração padrão da imagem (ADR-0013): grava no disco só fotografias
    # periódicas da memória (RDB), sem o registro de cada escrita (AOF).
    <<: *teto-banco-comparado
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-master-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:8.2.11-bookworm
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    cpus: "1"
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-replica-dados:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q 'master_link_status:up'"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0.9
    # Configuração padrão da imagem: o registro de escritas (commit log) é
    # forçado para o disco a cada 10 s. Só a memória do Java (heap) é
    # limitada, para caber no teto de 2 GB.
    <<: *teto-banco-comparado
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: linkpulse
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-dados:/var/lib/cassandra
    healthcheck:
      # Só testa se a porta 9042, por onde as consultas chegam, já abriu; ela
      # abre ao fim da partida. Rodar o cliente cqlsh a cada 10 s gastaria
      # cerca de 0,35 s de CPU da cota do banco. A consulta de verdade é feita
      # uma vez, pelo cassandra-esquema.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9042"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-esquema:
    # Aplica infra/cassandra/esquema.cql a cada subida: o keyspace (o
    # equivalente no Cassandra a um banco de dados) e a tabela cliques_por_link.
    # O esquema usa IF NOT EXISTS e pode ser aplicado de novo sem efeito.
    # Tenta 15 vezes, porque o Cassandra pode ainda não aceitar consultas.
    # Depois fica em espera, porque `up --wait` trataria a saída do contêiner
    # como falha.
    image: cassandra:5.0.9
    entrypoint:
      - sh
      - -c
      - |
        rm -f /tmp/esquema-aplicado
        n=0
        until cqlsh cassandra -f /esquema/esquema.cql; do
          n=$$((n + 1)); [ $$n -ge 15 ] && exit 1; sleep 2
        done
        touch /tmp/esquema-aplicado && exec sleep infinity
    init: true
    cpus: "1"
    mem_limit: 256m
    volumes:
      - ./infra/cassandra:/esquema:ro
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/esquema-aplicado"]
      interval: 2s
      timeout: 2s
      retries: 45

  postgres:
    image: postgres:18.7-bookworm
    # Todos os parâmetros no padrão (ADR-0013). A imagem roda os arquivos de
    # infra/postgres só na primeira subida, com o volume vazio.
    <<: *teto-banco-comparado
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
      POSTGRES_DB: linkpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pela rede (-h 127.0.0.1), como a aplicação vai se conectar. Na primeira
      # subida, o servidor temporário que cria o esquema só aceita conexões
      # locais, e o banco não pode contar como pronto antes do servidor final.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "linkpulse", "-d", "linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0.38-noble
    # Campanhas (descrição, tags e links); fica fora do benchmark (ADR-0012).
    cpus: "1"
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  verificar:
    # Roda infra/verificar_ambiente.py com as bibliotecas fixadas. O perfil o
    # deixa fora do `up`: docker compose run --rm verificar
    build: .
    profiles: ["verificacao"]
    command: ["python", "infra/verificar_ambiente.py"]
    cpus: "1"
    mem_limit: 256m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
    depends_on:
      redis-replica:
        condition: service_healthy
      cassandra-esquema:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  redis-master-dados:
  redis-replica-dados:
  cassandra-dados:
  postgres-dados:
  mongo-dados:
